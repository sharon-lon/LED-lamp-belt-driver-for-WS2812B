<svg width="900" height="420" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="420" fill="white"/>
<text x="40" y="40" font-size="26">WS2812B NRZ Timing</text>

<text x="60" y="100" font-size="22">Bit 0</text>
<path d="M180 120 H260 V220 H500" fill="none" stroke="black" stroke-width="4"/>
<text x="200" y="260" font-size="18">T0H (short HIGH)</text>
<text x="330" y="260" font-size="18">T0L (long LOW)</text>

<text x="60" y="310" font-size="22">Bit 1</text>
<path d="M180 330 H380 V330 H380 V410 H620" fill="none" stroke="black" stroke-width="4"/>
<text x="220" y="385" font-size="18">T1H (long HIGH)</text>
<text x="430" y="385" font-size="18">T1L (short LOW)</text>

</svg>