<svg width="900" height="500" xmlns="http://www.w3.org/2000/svg">
<rect width="900" height="500" fill="white"/>
<text x="450" y="40" text-anchor="middle" font-size="26">WS2812B NRZ Timing</text>

<!-- Bit 0 -->
<text x="80" y="110" font-size="22">Bit 0</text>
<path d="M220 130 H300 V230 H620" fill="none" stroke="black" stroke-width="4"/>
<text x="260" y="270" text-anchor="middle" font-size="18">T0H</text>
<text x="460" y="270" text-anchor="middle" font-size="18">T0L</text>
<text x="260" y="295" text-anchor="middle" font-size="16">short HIGH</text>
<text x="460" y="295" text-anchor="middle" font-size="16">long LOW</text>

<!-- Bit 1 -->
<text x="80" y="370" font-size="22">Bit 1</text>
<path d="M220 390 H500 V490 H620" fill="none" stroke="black" stroke-width="4"/>
<text x="360" y="435" text-anchor="middle" font-size="18">T1H</text>
<text x="360" y="460" text-anchor="middle" font-size="16">long HIGH</text>
<text x="560" y="435" text-anchor="middle" font-size="18">T1L</text>
<text x="560" y="460" text-anchor="middle" font-size="16">short LOW</text>

</svg>