<text x="80" y="410" font-size="22">Bit 1</text>
<path d="M220 430 H520 V530 H680" fill="none" stroke="black" stroke-width="4"/>
<text x="370" y="580" text-anchor="middle" font-size="18">T1H</text>
<text x="370" y="605" text-anchor="middle" font-size="16">long HIGH</text>
<text x="600" y="580" text-anchor="middle" font-size="18">T1L</text>
